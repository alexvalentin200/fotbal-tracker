<!DOCTYPE html>
<html lang="ro" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintetic Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0B0F19', 800: '#111827', 700: '#1F2937', 600: '#374151' },
                        neon: { cyan: '#06B6D4', lime: '#10B981' }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDK v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        window.fb = { initializeApp, getDatabase, ref, set, onValue };
        window.dispatchEvent(new Event('fb-ready'));
    </script>
    <style>body { background-color: #0B0F19; color: #F3F4F6; font-family: system-ui, sans-serif; }</style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            databaseURL: "https://sintetic-pro-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        function App() {
            const [connected, setConnected] = useState(false);
            const [sessionId, setSessionId] = useState(() => localStorage.getItem('sintetic_sid') || 'meci-luni');
            const [inputSid, setInputSid] = useState(sessionId);
            const [activeTab, setActiveTab] = useState('match');

            // Starea globală sincronizată
            const [teamNames, setTeamNames] = useState({ teamA: 'Echipa A', teamB: 'Echipa B', teamC: 'Echipa C' });
            const [teams, setTeams] = useState({ teamA: [], teamB: [], teamC: [] });
            const [pool, setPool] = useState([
                { id: '1', name: 'Valentin', rating: 5, role: 'player', paid: false, present: true },
                { id: '2', name: 'Dragoș', rating: 4, role: 'player', paid: false, present: true },
                { id: '3', name: 'Irinel', rating: 4, role: 'player', paid: false, present: true },
                { id: '4', name: 'Alexie', rating: 3, role: 'player', paid: false, present: true },
                { id: '5', name: 'Mihai', rating: 3, role: 'goalkeeper', paid: false, present: true },
                { id: '6', name: 'Andrei', rating: 4, role: 'player', paid: false, present: true },
                { id: '7', name: 'Bogdan', rating: 3, role: 'player', paid: false, present: true },
                { id: '8', name: 'Cristi', rating: 3, role: 'goalkeeper', paid: false, present: true }
            ]);
            const [totalCost, setTotalCost] = useState(150);
            const [matches, setMatches] = useState([]);
            const [history, setHistory] = useState([]);

            // Stare meci curent
            const [currentMatch, setCurrentMatch] = useState({
                teamA: 'teamA',
                teamB: 'teamB',
                scoreA: 0,
                scoreB: 0,
                status: 'idle', // idle, playing, penalty, finished
                timer: 420,
                timerEnabled: false
            });

            // Formular jucător nou
            const [newName, setNewName] = useState('');
            const [newRating, setNewRating] = useState(3);
            const [newRole, setNewRole] = useState('player');

            // Instanță Firebase DB ref
            const dbRef = React.useRef(null);
            const isRemoteUpdate = React.useRef(false);

            // Conectare și Ascultător Firebase
            useEffect(() => {
                const initFb = () => {
                    try {
                        const { initializeApp, getDatabase, ref, onValue, set } = window.fb;
                        const app = initializeApp(firebaseConfig);
                        const database = getDatabase(app);
                        const sRef = ref(database, `sessions/${sessionId}`);
                        dbRef.current = sRef;

                        onValue(sRef, (snapshot) => {
                            const data = snapshot.val();
                            if (data) {
                                isRemoteUpdate.current = true;
                                if (data.teamNames) setTeamNames(data.teamNames);
                                if (data.teams) setTeams(data.teams);
                                if (data.pool) setPool(data.pool);
                                if (data.totalCost !== undefined) setTotalCost(data.totalCost);
                                setMatches(data.matches || []);
                                setHistory(data.history || []);
                                setTimeout(() => { isRemoteUpdate.current = false; }, 50);
                            } else {
                                // Inițializare sesiune goală în DB
                                set(sRef, { teamNames, teams, pool, totalCost, matches: [], history: [] });
                            }
                            setConnected(true);
                        });
                    } catch (err) {
                        console.error(err);
                    }
                };

                if (window.fb) initFb();
                else window.addEventListener('fb-ready', initFb);
            }, [sessionId]);

            // Funcție generală de salvare în Firebase
            const saveData = (newData) => {
                if (!dbRef.current || isRemoteUpdate.current) return;
                const { set } = window.fb;
                const payload = {
                    teamNames,
                    teams,
                    pool,
                    totalCost,
                    matches,
                    history,
                    ...newData
                };
                set(dbRef.current, payload);
            };

            // Schimbare sesiune
            const handleSessionChange = (e) => {
                e.preventDefault();
                if (!inputSid.trim()) return;
                const cleanId = inputSid.trim().toLowerCase().replace(/\s+/g, '-');
                localStorage.setItem('sintetic_sid', cleanId);
                setSessionId(cleanId);
            };

            // Timer meci
            useEffect(() => {
                let interval = null;
                if (currentMatch.status === 'playing' && currentMatch.timerEnabled && currentMatch.timer > 0) {
                    interval = setInterval(() => {
                        setCurrentMatch(prev => {
                            if (prev.timer <= 1) {
                                clearInterval(interval);
                                return { ...prev, timer: 0, status: prev.scoreA === prev.scoreB ? 'penalty' : 'finished' };
                            }
                            return { ...prev, timer: prev.timer - 1 };
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [currentMatch.status, currentMatch.timerEnabled, currentMatch.timer]);

            // Gestionare Scor
            const updateScore = (team, delta) => {
                setCurrentMatch(prev => {
                    let sA = prev.scoreA;
                    let sB = prev.scoreB;
                    if (team === 'A') sA = Math.max(0, Math.min(2, sA + delta));
                    if (team === 'B') sB = Math.max(0, Math.min(2, sB + delta));

                    let status = prev.status;
                    if (sA === 2 || sB === 2) status = 'finished';

                    return { ...prev, scoreA: sA, scoreB: sB, status };
                });
            };

            // Salvare Meci conform regulilor de punctaj
            const saveMatch = (penaltyWinner = null) => {
                const { scoreA, scoreB, teamA, teamB } = currentMatch;
                let ptsA = 0, ptsB = 0, details = '';
                const diff = Math.abs(scoreA - scoreB);

                if (scoreA > scoreB) {
                    if (diff >= 2) { ptsA = 3; ptsB = 0; details = 'Victorie la 2+ goluri'; }
                    else { ptsA = 2; ptsB = 0; details = 'Victorie la 1 gol'; }
                } else if (scoreB > scoreA) {
                    if (diff >= 2) { ptsB = 3; ptsA = 0; details = 'Victorie la 2+ goluri'; }
                    else { ptsB = 2; ptsA = 0; details = 'Victorie la 1 gol'; }
                } else {
                    if (penaltyWinner === 'A') { ptsA = 1; ptsB = 0.5; details = 'Victorie la penalty'; }
                    else if (penaltyWinner === 'B') { ptsB = 1; ptsA = 0.5; details = 'Victorie la penalty'; }
                    else { ptsA = 1; ptsB = 1; details = 'Egalitate'; }
                }

                const newM = {
                    id: Date.now(),
                    teamAKey: teamA,
                    teamBKey: teamB,
                    nameA: teamNames[teamA],
                    nameB: teamNames[teamB],
                    scoreA, scoreB, ptsA, ptsB, details
                };

                const updatedMatches = [newM, ...matches];
                setMatches(updatedMatches);
                saveData({ matches: updatedMatches });

                setCurrentMatch({
                    teamA: 'teamA', teamB: 'teamB', scoreA: 0, scoreB: 0,
                    status: 'idle', timer: 420, timerEnabled: currentMatch.timerEnabled
                });
            };

            // Generator echipe echilibrat (Portari + Câmp)
            const generateTeams = () => {
                const present = pool.filter(p => p.present);
                if (present.length < 6) {
                    alert('Ai nevoie de cel puțin 6 jucători prezenți pentru a genera 3 echipe!');
                    return;
                }
                const gks = present.filter(p => p.role === 'goalkeeper');
                const outfield = present.filter(p => p.role !== 'goalkeeper').sort((a, b) => b.rating - a.rating);

                let tA = [], tB = [], tC = [];
                if (gks[0]) tA.push(gks[0]);
                if (gks[1]) tB.push(gks[1]);
                if (gks[2]) tC.push(gks[2]);

                const rem = [...gks.slice(3), ...outfield];
                rem.forEach((p, idx) => {
                    if (idx % 3 === 0) tA.push(p);
                    else if (idx % 3 === 1) tB.push(p);
                    else tC.push(p);
                });

                const newTeams = { teamA: tA, teamB: tB, teamC: tC };
                setTeams(newTeams);
                saveData({ teams: newTeams });
            };

            // Arhivare sesiune
            const archiveSession = () => {
                if (matches.length === 0) {
                    alert('Nu există meciuri în sesiunea curentă!');
                    return;
                }
                const summary = { id: Date.now(), date: new Date().toLocaleDateString('ro-RO'), matchesCount: matches.length, matches };
                const updatedHistory = [summary, ...history];
                setHistory(updatedHistory);
                setMatches([]);
                saveData({ history: updatedHistory, matches: [] });
            };

            // Gestionare Lot
            const addPlayer = (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                const p = { id: Date.now().toString(), name: newName.trim(), rating: Number(newRating), role: newRole, paid: false, present: true };
                const updated = [...pool, p];
                setPool(updated);
                setNewName('');
                saveData({ pool: updated });
            };

            const togglePresent = (id) => {
                const updated = pool.map(x => x.id === id ? { ...x, present: !x.present } : x);
                setPool(updated);
                saveData({ pool: updated });
            };

            const togglePaid = (id) => {
                const updated = pool.map(x => x.id === id ? { ...x, paid: !x.paid } : x);
                setPool(updated);
                saveData({ pool: updated });
            };

            const deletePlayer = (id) => {
                const updated = pool.filter(x => x.id !== id);
                setPool(updated);
                saveData({ pool: updated });
            };

            // Clasament între echipe
            const getLeaderboard = () => {
                const stats = {
                    teamA: { key: 'teamA', name: teamNames.teamA, played: 0, wins: 0, draws: 0, losses: 0, points: 0, gf: 0, ga: 0 },
                    teamB: { key: 'teamB', name: teamNames.teamB, played: 0, wins: 0, draws: 0, losses: 0, points: 0, gf: 0, ga: 0 },
                    teamC: { key: 'teamC', name: teamNames.teamC, played: 0, wins: 0, draws: 0, losses: 0, points: 0, gf: 0, ga: 0 }
                };

                matches.forEach(m => {
                    if (stats[m.teamAKey]) {
                        stats[m.teamAKey].played++;
                        stats[m.teamAKey].gf += m.scoreA;
                        stats[m.teamAKey].ga += m.scoreB;
                        stats[m.teamAKey].points += m.ptsA;
                        if (m.ptsA >= 2) stats[m.teamAKey].wins++;
                        else if (m.ptsA === 1) stats[m.teamAKey].draws++;
                        else stats[m.teamAKey].losses++;
                    }
                    if (stats[m.teamBKey]) {
                        stats[m.teamBKey].played++;
                        stats[m.teamBKey].gf += m.scoreB;
                        stats[m.teamBKey].ga += m.scoreA;
                        stats[m.teamBKey].points += m.ptsB;
                        if (m.ptsB >= 2) stats[m.teamBKey].wins++;
                        else if (m.ptsB === 1) stats[m.teamBKey].draws++;
                        else stats[m.teamBKey].losses++;
                    }
                });

                return Object.values(stats).sort((a, b) => b.points - a.points || (b.gf - b.ga) - (a.gf - a.ga));
            };

            const leaderboard = getLeaderboard();
            const presentCount = pool.filter(p => p.present).length;
            const costPerPerson = presentCount > 0 ? (totalCost / presentCount).toFixed(2) : 0;

            return (
                <div className="max-w-md mx-auto min-h-screen pb-24 bg-dark-900 flex flex-col">
                    {/* Header */}
                    <header className="bg-dark-800 border-b border-dark-700 p-4 sticky top-0 z-50 flex justify-between items-center">
                        <span className="text-xl font-black bg-gradient-to-r from-neon-cyan to-neon-lime bg-clip-text text-transparent">SINTETIC PRO</span>
                        <div className="flex items-center space-x-1.5">
                            <span className={`w-2.5 h-2.5 rounded-full ${connected ? 'bg-neon-lime animate-pulse' : 'bg-yellow-500'}`}></span>
                            <span className="text-xs text-gray-400">{connected ? 'Live Sync' : 'Se conectează...'}</span>
                        </div>
                    </header>

                    {/* Bară Sesiune */}
                    <div className="bg-dark-800/90 border-b border-dark-700 px-4 py-2 flex items-center justify-between text-xs">
                        <span className="text-gray-400">Sesiune: <strong className="text-neon-cyan">{sessionId}</strong></span>
                        <form onSubmit={handleSessionChange} className="flex gap-1">
                            <input 
                                type="text" 
                                value={inputSid} 
                                onChange={(e) => setInputSid(e.target.value)} 
                                placeholder="Cod sesiune..."
                                className="bg-dark-700 border border-dark-600 rounded px-2 py-1 text-xs text-gray-100 w-28 focus:outline-none focus:border-neon-cyan"
                            />
                            <button type="submit" className="bg-neon-cyan text-dark-900 font-bold px-2 py-1 rounded">Schimbă</button>
                        </form>
                    </div>

                    {/* Conținut Pagini */}
                    <main className="flex-1 p-4 overflow-y-auto space-y-4">
                        {/* TAB 1: MECI */}
                        {activeTab === 'match' && (
                            <div className="space-y-4">
                                <div className="bg-dark-800 border border-dark-700 rounded-2xl p-4 shadow-xl text-center space-y-4">
                                    <div className="flex justify-between items-center">
                                        <span className="text-xs font-semibold uppercase tracking-wider text-neon-cyan">Meci Activ</span>
                                        <div className="flex items-center space-x-2">
                                            <span className="text-xs text-gray-400">Cronometru (7 min):</span>
                                            <input 
                                                type="checkbox" 
                                                checked={currentMatch.timerEnabled} 
                                                onChange={(e) => setCurrentMatch({...currentMatch, timerEnabled: e.target.checked})}
                                                className="w-4 h-4 accent-neon-cyan cursor-pointer"
                                            />
                                        </div>
                                    </div>

                                    {currentMatch.timerEnabled && (
                                        <div className="bg-dark-900 py-1.5 px-4 rounded-xl inline-block border border-dark-700">
                                            <span className="text-2xl font-mono font-bold text-neon-cyan">
                                                {Math.floor(currentMatch.timer / 60)}:{String(currentMatch.timer % 60).padStart(2, '0')}
                                            </span>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-[10px] text-gray-400 block mb-1 uppercase font-bold">Echipa 1</label>
                                            <select 
                                                value={currentMatch.teamA}
                                                onChange={(e) => setCurrentMatch({...currentMatch, teamA: e.target.value})}
                                                className="w-full bg-dark-700 border border-dark-600 text-xs font-bold rounded-lg p-2 text-neon-cyan"
                                            >
                                                <option value="teamA">{teamNames.teamA}</option>
                                                <option value="teamB">{teamNames.teamB}</option>
                                                <option value="teamC">{teamNames.teamC}</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-[10px] text-gray-400 block mb-1 uppercase font-bold">Echipa 2</label>
                                            <select 
                                                value={currentMatch.teamB}
                                                onChange={(e) => setCurrentMatch({...currentMatch, teamB: e.target.value})}
                                                className="w-full bg-dark-700 border border-dark-600 text-xs font-bold rounded-lg p-2 text-neon-lime"
                                            >
                                                <option value="teamA">{teamNames.teamA}</option>
                                                <option value="teamB">{teamNames.teamB}</option>
                                                <option value="teamC">{teamNames.teamC}</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-5 gap-2 items-center">
                                        <div className="col-span-2 text-center">
                                            <div className="font-bold text-xs text-gray-300 truncate">{teamNames[currentMatch.teamA]}</div>
                                            <div className="text-4xl font-extrabold my-2 text-neon-cyan">{currentMatch.scoreA}</div>
                                            {currentMatch.status === 'playing' && (
                                                <div className="flex justify-center space-x-2">
                                                    <button onClick={() => updateScore('A', 1)} className="bg-neon-cyan text-dark-900 font-bold px-3 py-1 rounded-lg text-sm">+</button>
                                                    <button onClick={() => updateScore('A', -1)} className="bg-dark-700 text-gray-300 px-3 py-1 rounded-lg text-sm">-</button>
                                                </div>
                                            )}
                                        </div>
                                        <div className="col-span-1 text-center font-black text-gray-500 text-lg">VS</div>
                                        <div className="col-span-2 text-center">
                                            <div className="font-bold text-xs text-gray-300 truncate">{teamNames[currentMatch.teamB]}</div>
                                            <div className="text-4xl font-extrabold my-2 text-neon-lime">{currentMatch.scoreB}</div>
                                            {currentMatch.status === 'playing' && (
                                                <div className="flex justify-center space-x-2">
                                                    <button onClick={() => updateScore('B', 1)} className="bg-neon-lime text-dark-900 font-bold px-3 py-1 rounded-lg text-sm">+</button>
                                                    <button onClick={() => updateScore('B', -1)} className="bg-dark-700 text-gray-300 px-3 py-1 rounded-lg text-sm">-</button>
                                                </div>
                                            )}
                                        </div>
                                    </div>

                                    {currentMatch.status === 'idle' && (
                                        <button onClick={() => setCurrentMatch({...currentMatch, status: 'playing'})} className="w-full py-3 bg-gradient-to-r from-neon-cyan to-neon-lime text-dark-900 font-black rounded-xl shadow-lg">
                                            ÎNCEPE MECIUL
                                        </button>
                                    )}

                                    {currentMatch.status === 'playing' && (
                                        <div className="space-y-2">
                                            <span className="text-xs text-yellow-400">Meci în desfășurare (Max 2 goluri)</span>
                                            <button onClick={() => setCurrentMatch({...currentMatch, status: currentMatch.scoreA === currentMatch.scoreB ? 'penalty' : 'finished'})} className="w-full py-2 bg-red-600/20 text-red-400 border border-red-600/50 font-bold rounded-xl text-sm">
                                                Încheie Meciul
                                            </button>
                                        </div>
                                    )}

                                    {currentMatch.status === 'penalty' && (
                                        <div className="space-y-2 bg-dark-700/50 p-3 rounded-xl border border-dark-600">
                                            <div className="text-xs font-bold text-yellow-400">Egalitate! Cine a câștigat la penalty-uri?</div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <button onClick={() => saveMatch('A')} className="py-2 bg-neon-cyan text-dark-900 font-bold rounded-lg text-xs truncate px-1">{teamNames[currentMatch.teamA]}</button>
                                                <button onClick={() => saveMatch('B')} className="py-2 bg-neon-lime text-dark-900 font-bold rounded-lg text-xs truncate px-1">{teamNames[currentMatch.teamB]}</button>
                                            </div>
                                        </div>
                                    )}

                                    {currentMatch.status === 'finished' && (
                                        <button onClick={() => saveMatch(null)} className="w-full py-3 bg-neon-lime text-dark-900 font-black rounded-xl shadow-lg">
                                            Salvează în Clasament
                                        </button>
                                    )}
                                </div>

                                <div className="space-y-2">
                                    <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wider">Meciurile Sesiunii Curente ({matches.length})</h3>
                                    {matches.map(m => (
                                        <div key={m.id} className="bg-dark-800 border border-dark-700 p-3 rounded-xl flex justify-between items-center text-sm">
                                            <div>
                                                <div className="font-bold">{m.nameA} vs {m.nameB}</div>
                                                <div className="text-xs text-gray-400">{m.details}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-mono font-bold text-neon-cyan">{m.scoreA} - {m.scoreB}</div>
                                                <div className="text-xs text-gray-400">{m.ptsA}p / {m.ptsB}p</div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB 2: ECHIPE */}
                        {activeTab === 'teams' && (
                            <div className="space-y-4">
                                <div className="bg-dark-800 border border-dark-700 rounded-2xl p-4 space-y-3">
                                    <h3 className="font-bold text-gray-200 text-sm">Setează Numele Echipelor</h3>
                                    <div className="grid grid-cols-3 gap-2">
                                        {['teamA', 'teamB', 'teamC'].map((k, idx) => (
                                            <div key={k}>
                                                <label className="text-[10px] text-gray-400 block mb-1">Echipa {idx+1}</label>
                                                <input 
                                                    type="text" 
                                                    value={teamNames[k]} 
                                                    onChange={(e) => {
                                                        const updated = {...teamNames, [k]: e.target.value};
                                                        setTeamNames(updated);
                                                        saveData({ teamNames: updated });
                                                    }}
                                                    className="w-full bg-dark-700 border border-dark-600 rounded-lg p-2 text-xs font-bold text-neon-cyan"
                                                />
                                            </div>
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-dark-800 border border-dark-700 rounded-2xl p-4 flex justify-between items-center">
                                    <div>
                                        <h3 className="font-bold text-gray-200 text-sm">Generator Echipe</h3>
                                        <p className="text-xs text-gray-400">Împarte portarii și jucătorii echilibrat.</p>
                                    </div>
                                    <button onClick={generateTeams} className="px-3 py-2 bg-neon-cyan text-dark-900 font-bold text-xs rounded-xl shadow-lg">
                                        Generează
                                    </button>
                                </div>

                                {['teamA', 'teamB', 'teamC'].map(k => (
                                    <div key={k} className="bg-dark-800 border border-dark-700 rounded-2xl p-3">
                                        <h4 className="font-bold text-neon-cyan mb-2 border-b border-dark-700 pb-1 text-sm">{teamNames[k]} ({teams[k]?.length || 0})</h4>
                                        <ul className="space-y-1">
                                            {teams[k]?.map(p => (
                                                <li key={p.id} className="text-xs flex justify-between items-center bg-dark-700/50 px-2 py-1.5 rounded-lg">
                                                    <span>{p.name} {p.role === 'goalkeeper' && <span className="text-yellow-400 font-bold">(GK)</span>}</span>
                                                    <span className="text-dark-900 bg-neon-cyan px-1.5 rounded font-mono text-[10px] font-bold">★{p.rating}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* TAB 3: LOT & BANI */}
                        {activeTab === 'squad' && (
                            <div className="space-y-4">
                                <div className="bg-dark-800 border border-dark-700 rounded-2xl p-4 space-y-3">
                                    <h3 className="font-bold text-gray-200 text-sm">Costuri & Prezență</h3>
